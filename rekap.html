<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Absensi PJLP</title>
  <meta name="theme-color" content="#0d6efd">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app wide">
    <header class="topbar">
      <div class="brand">
        <span class="logo">📋</span>
        <div>
          <h1>Rekap Absensi</h1>
          <p class="subtitle">Data kehadiran PJLP</p>
        </div>
      </div>
      <a class="link-rekap" href="index.html">&larr; Absen</a>
    </header>

    <main class="card">
      <div class="filterbar">
        <label>
          Cari Nama
          <input type="text" id="f-nama" placeholder="Ketik nama...">
        </label>
        <label>
          Dari Tanggal
          <input type="date" id="f-dari">
        </label>
        <label>
          Sampai Tanggal
          <input type="date" id="f-sampai">
        </label>
        <div class="filter-actions">
          <button type="button" id="btn-refresh" class="mini">↻ Muat Ulang</button>
          <button type="button" id="btn-ekspor" class="mini primary">⬇ Ekspor CSV</button>
        </div>
      </div>

      <div id="info" class="status muted">Memuat data...</div>

      <div class="table-wrap">
        <table id="tabel">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Jam</th>
              <th>Nama</th>
              <th>NIP/ID</th>
              <th>Jenis</th>
              <th>Lokasi</th>
              <th>Foto</th>
              <th>Keterangan</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/rekap.js"></script>
</body>
</html>
