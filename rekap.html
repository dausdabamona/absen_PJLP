<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Absensi PJLP</title>
  <meta name="theme-color" content="#0d6efd">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="app wide">
    <header class="topbar">
      <div class="brand">
        <span class="logo">📋</span>
        <div>
          <h1>Rekap</h1>
          <p class="subtitle">Absensi &amp; Jurnal Kegiatan PJLP</p>
        </div>
      </div>
      <a class="link-rekap" href="index.html">&larr; Absen</a>
    </header>

    <!-- Login -->
    <main id="seksi-login" class="card center">
      <h2 class="seksi-judul">Masuk untuk Melihat Rekap</h2>
      <p class="seksi-info">Anda hanya melihat data sendiri. Admin melihat seluruh data.</p>
      <div id="g-signin" class="gbtn-wrap"></div>
      <div id="login-pesan" class="status err"></div>
    </main>

    <!-- Konten -->
    <main id="seksi-konten" class="card hidden">
      <div id="badge-admin" class="info-jam hidden">👑 Mode admin: menampilkan data semua pegawai.</div>

      <div class="tab-status">
        <button class="tab aktif" data-mode="absensi">Absensi</button>
        <button class="tab" data-mode="jurnal">Jurnal Kegiatan</button>
      </div>

      <div class="filterbar">
        <label>Cari Nama<input type="text" id="f-nama" placeholder="Ketik nama..."></label>
        <label>Dari Tanggal<input type="date" id="f-dari"></label>
        <label>Sampai Tanggal<input type="date" id="f-sampai"></label>
        <div class="filter-actions">
          <button type="button" id="btn-refresh" class="mini">↻ Muat Ulang</button>
          <button type="button" id="btn-ekspor" class="mini primary">⬇ Ekspor CSV</button>
        </div>
      </div>

      <div id="info" class="status muted">Memuat data...</div>
      <div class="table-wrap">
        <table id="tabel">
          <thead><tr id="thead-row"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/rekap.js"></script>
</body>
</html>
