<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Absensi PJLP</title>
  <meta name="theme-color" content="#0d6efd">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app wide">
    <header class="topbar">
      <div class="brand">
        <span class="logo">📋</span>
        <div>
          <h1>Rekap</h1>
          <p class="subtitle">Absensi &amp; Jurnal Kegiatan PJLP</p>
        </div>
      </div>
      <a class="link-rekap" href="index.html?absen=1">&larr; Absen</a>
    </header>

    <main class="card">
      <div id="badge-admin" class="info-jam hidden">👑 Mode admin: menampilkan data semua perangkat.</div>
      <p class="seksi-info">Tanpa password hanya menampilkan absen dari perangkat ini. Admin isi password untuk melihat semua.</p>

      <div class="tab-status">
        <button class="tab aktif" data-mode="ringkasan">📊 Ringkasan</button>
        <button class="tab" data-mode="absensi">Absensi</button>
        <button class="tab" data-mode="jurnal">Jurnal Kegiatan</button>
        <button class="tab" data-mode="izin">Izin/Sakit/Cuti</button>
      </div>

      <div class="filterbar">
        <label>Bulan<input type="month" id="f-bulan"></label>
        <label>Password Admin <span class="opsional">(untuk lihat semua)</span><input type="password" id="f-admin"></label>
        <div class="filter-actions">
          <button type="button" id="btn-refresh" class="mini">↻ Muat Ulang</button>
          <button type="button" id="btn-ekspor" class="mini primary">⬇ Ekspor CSV</button>
        </div>
      </div>

      <div id="info" class="status muted">Memuat data...</div>
      <div class="table-wrap">
        <table id="tabel">
          <thead><tr id="thead-row"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/rekap.js"></script>
</body>
</html>
