<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Absensi PJLP</title>
  <meta name="theme-color" content="#0d6efd">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app wide">
    <header class="topbar">
      <div class="brand">
        <span class="logo">📋</span>
        <div>
          <h1>Rekap</h1>
          <p class="subtitle">Absensi &amp; Jurnal Kegiatan PJLP</p>
        </div>
      </div>
      <a class="link-rekap" href="index.html?absen=1">&larr; Absen</a>
    </header>

    <!-- Gerbang login: Rekap khusus admin -->
    <main id="seksi-login" class="card">
      <h2 class="seksi-judul">Masuk Admin</h2>
      <p class="seksi-info">Halaman rekap hanya dapat dibuka oleh admin terdaftar.</p>
      <form id="form-login" autocomplete="off">
        <label>Email Admin<input type="email" id="l-email" placeholder="dausdaba@polikpsorong.ac.id" required></label>
        <label>Password Admin<input type="password" id="l-password" required></label>
        <button type="submit" id="btn-login" class="submit">Masuk</button>
      </form>
      <div id="login-pesan" class="status err"></div>
    </main>

    <main id="seksi-rekap" class="card hidden">
      <div class="topbar-mini">
        <div id="badge-admin" class="info-jam">👑 Mode admin: menampilkan data semua perangkat.</div>
        <button type="button" id="btn-keluar" class="mini">Keluar</button>
      </div>

      <div class="tab-status">
        <button class="tab aktif" data-mode="absensi">Absensi</button>
        <button class="tab" data-mode="jurnal">Jurnal Kegiatan</button>
        <button class="tab" data-mode="izin">Izin/Sakit/Cuti</button>
      </div>

      <div class="filterbar">
        <label>Cari Nama<input type="text" id="f-nama" placeholder="Ketik nama..."></label>
        <label>Dari Tanggal<input type="date" id="f-dari"></label>
        <label>Sampai Tanggal<input type="date" id="f-sampai"></label>
        <div class="filter-actions">
          <button type="button" id="btn-refresh" class="mini">↻ Muat Ulang</button>
          <button type="button" id="btn-ekspor" class="mini primary">⬇ Ekspor CSV</button>
        </div>
      </div>

      <div id="info" class="status muted">Memuat data...</div>
      <div class="table-wrap">
        <table id="tabel">
          <thead><tr id="thead-row"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/rekap.js"></script>
</body>
</html>
